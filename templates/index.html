{% extends "base.html" %}

{% block title %}Journal{% endblock %}

{% block content %}
<div class="accordion-nav" id="accordion">
    <!-- Years Level -->
    <div class="nav-level" data-level="years">
        {% for year in years %}
        <button class="nav-item{% if not year.has_entries %} muted{% endif %}"
                data-year="{{ year.year }}">
            {{ year.year }}
        </button>
        {% endfor %}
    </div>

    <!-- Months Level -->
    <div class="nav-level" data-level="months" hidden>
        <button class="nav-back" id="months-back">← <span id="months-year"></span></button>
        <div id="months-container"></div>
    </div>

    <!-- Entries Level -->
    <div class="nav-level" data-level="entries" hidden>
        <button class="nav-back" id="entries-back">← <span id="entries-month-year"></span></button>
        <div id="entries-container"></div>
    </div>
</div>

<script>
// Data embedded directly for instant loading
const journalData = {
    years: [
        {% for year in years %}
        { year: {{ year.year }}, hasEntries: {{ 'true' if year.has_entries else 'false' }} }{{ ',' if not loop.last }}
        {% endfor %}
    ],
    months: {
        {% for year_data in months_by_year %}
        {{ year_data.year }}: [
            {% for month in year_data.months %}
            { name: "{{ month.name }}", number: {{ month.number }}, hasEntries: {{ 'true' if month.has_entries else 'false' }} }{{ ',' if not loop.last }}
            {% endfor %}
        ]{{ ',' if not loop.last }}
        {% endfor %}
    },
    entries: {
        {%- set entry_months = [] %}
        {%- for year_data in months_by_year %}
            {%- for month in year_data.months %}
                {%- if month.has_entries %}
                    {%- set _ = entry_months.append((year_data.year, month.number, month.entries)) %}
                {%- endif %}
            {%- endfor %}
        {%- endfor %}
        {%- for year, month_num, entries in entry_months %}
        "{{ year }}-{{ month_num }}": [
            {%- for entry in entries %}
            { day: {{ entry.day }}, url: "{{ url_path }}{{ entry.url }}", preview: "{{ entry.preview }}" }{{ ',' if not loop.last }}
            {%- endfor %}
        ]{{ ',' if not loop.last }}
        {%- endfor %}
    }
};
</script>

<script src="{{ url_path }}/static/js/accordion.js"></script>
{% endblock %}
