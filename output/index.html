            { day: 8, url: "/entries/1984/09/1984-09-08-saturday-september-8.html", preview: "This evening, we had another long chat with Peter, while the boys were getting dished up with rainbow ice-cream. He said, ‘I was out on the playground and a boy" }
        ],

            { day: 15, url: "/entries/1985/01/1985-01-15-tuesday-january-15.html", preview: "The temperature runs between minus 10 and minus 5 with a cold northeast wind. Matthew slept at 2:30 this afternoon, and didn’t go down until after 9. After leaving his" }
        ],
        "1985-2": [
            { day: 5, url: "/entries/1985/02/1985-02-05-tuesday-february-5.html", preview: "The boys are sleeping together tonight for the first time. Earlier attempts have been aborted by giggling. Matthew’s head is on Peter’s arm. He is snorting and whistling. Peter was" },
            { day: 17, url: "/entries/1985/02/1985-02-17-sunday-february-17.html", preview: "Lloyd Skarsgard (Sr) came through Saskatoon on his way home from meetings in Ottawa. He arrived on Friday. We had breakfast at the Saskatoon Inn Saturday. There is no cello" },
            { day: 18, url: "/entries/1985/02/1985-02-18-tuesday-february-18.html", preview: "John told Cheryl time and again at the lesson that he can’t get over Peter’s fluid bowing. Matthew and I sat outside the room and worked on a Disney puzzle." },
            { day: 19, url: "/entries/1985/02/1985-02-19-wednesday-february-19.html", preview: "Shelly Loeffler went to the hospital for an early delivery. Cheryl hadn’t planned to go full time until March 1. She spent the whole day at school. She has said" },
            { day: 25, url: "/entries/1985/02/1985-02-25-monday-february-25.html", preview: "Cheryl is very busy working full-time. It is not ideal. She is so lonely for the boys. We both are. Peter practiced cello. Then it was Matthew’s turn. Cheryl has" },
            { day: 28, url: "/entries/1985/02/1985-02-28-thursday-february-28.html", preview: "It was 4 above this morning. Snowbanks are collapsing, water is dripping. Cheryl’s parents leave for Hawaii on Sunday. We had supper with them at The Station. Matthew did puzzles" }

        "1985-3": [
            { day: 1, url: "/entries/1985/03/1985-03-01-friday-march-1.html", preview: "The evening was spent with the Peltiers. Peter, Matthew and Sarah lay under umbrellas while watching Wizard of Oz. We were home by 10:15. Peter spoke from the back seat." },
            { day: 3, url: "/entries/1985/03/1985-03-03-sunday-march-3.html", preview: "Sunny, quite warm, but not enough to melt the blocks of ice that make driving along residential streets nearly impossible. Driving towards the house with Peter, my tires caught in" },
            { day: 10, url: "/entries/1985/03/1985-03-10-sunday-march-10.html", preview: "Ski plans have been dashed. Carol is due. The baby could come this weekend. Mom feels she can’t be away. The weather is beautiful, springlike. It’s the season of dirty" }
        ],
        "1985-4": [
            { day: 14, url: "/entries/1985/04/1985-04-14-sunday-april-14.html", preview: "Last day of the Easter Holidays. We spent the entire time at home. I spent time getting mid-term marks ready for tomorrow. Cheryl and Peter are booked for dental appointments." },
            { day: 17, url: "/entries/1985/04/1985-04-17-wednesday-april-17.html", preview: "We went with Cheryl’s parents to Homestead after driving by Carol’s to get the maternity clothes Cheryl lent, which we’ll give to Bev for her daughter. Peter refuses to accept" }

        "1985-5": [

        ],
        "1985-7": [
            { day: 1, url: "/entries/1985/07/1985-07-01-monday-july-1.html", preview: "We’re getting our first real taste of holiday. Cheryl and I are getting over the mind games, pretending tomorrow is Monday and it’s back to work. All day the sky" },
            { day: 3, url: "/entries/1985/07/1985-07-03-wednesday-july-3.html", preview: "Hot and windy. I stained until 4:30. Peter worked on a patch on the west side, his eyes inches from the wood, studying the bare spots of wood, the cracks" },
            { day: 15, url: "/entries/1985/07/1985-07-15-monday-july-15.html", preview: "Last night, Peter slept at Cheryl’s parents’. We began the day at church, sitting across the narthex from Mama and Papa. Matthew waved and winked at them the entire service." },
            { day: 17, url: "/entries/1985/07/1985-07-17-wednesday-july-17.html", preview: "Peter is still having nightmares. He wakes up crying, telling us while they’re still vivid: ‘I was in a pool and these hands appeared from the side and kept pushing" },
            { day: 22, url: "/entries/1985/07/1985-07-22-monday-july-22.html", preview: "Last Wednesday evening, I was surprised by a birthday celebration. I got a propane BBQ to take to the lake this weekend. Mom and Dad were there also. The boys" },
            { day: 24, url: "/entries/1985/07/1985-07-24-wednesday-july-24.html", preview: "‘Waskesieu Weather’ (Cheryl’s term): It has been two days of a cool wind, cloud, and periodic rain. When outside we wear sweaters and rain gear. There were occasional breaks in" },
            { day: 25, url: "/entries/1985/07/1985-07-25-thursday-july-25.html", preview: "We started the day doing laundry. We tramped from store to store, hunting down a supply of quarters. Cheryl and I ordered coffee and the boys iced tea at the" },
            { day: 26, url: "/entries/1985/07/1985-07-26-friday-july-26.html", preview: "The forecast for sun and warmth has been dashed. We kept busy nonetheless. We slept in. The boys woke not completely rested. We attempted a walk along Waskesieu River, but" },
            { day: 29, url: "/entries/1985/07/1985-07-29-monday-july-29.html", preview: "The weather didn’t improve. Even so, we were determined to get Les’ boat into the water for skiing and hydro-sliding. The lake churned with whitecaps. We found calmer waters up" },
            { day: 30, url: "/entries/1985/07/1985-07-30-tuesday-july-30.html", preview: "Peter is brightest first thing in the morning. He lies awake, thinking thoughts, then explaining them to whoever is first into his room. This morning while Cheryl and Matthew lay" },
            { day: 31, url: "/entries/1985/07/1985-07-31-wednesday-july-31.html", preview: "We were invited to a BBQ at Grandma Skarsgard’s to see Peter and Paul Skarsgard. Pots of food, gallons of ice-cream. Matthew and Peter played with Michael, Bradley, and Kristen" }
        ],
        "1985-8": [
            { day: 3, url: "/entries/1985/08/1985-08-03-saturday-august-3.html", preview: "We are on our third day at the farm. Our big job is painting the barn. Red. ‘So red,’ said Peter, who was on the scaffolding left of the front" },
            { day: 8, url: "/entries/1985/08/1985-08-08-thursday-august-8.html", preview: "Michael and Cathy are in town for a four-day weekend. Michael’s haircut is a lot like Moe’s of the Three Stooges. Since returning from the farm, the boys have done" },
            { day: 28, url: "/entries/1985/08/1985-08-28-wednesday-august-28.html", preview: "Our last day of summer holidays. We’ve had our fill of visiting. Peter and Louise spent Sunday night here on their return from Ontario. They arrived late, visited long into" }
        ],
        "1985-9": [
            { day: 1, url: "/entries/1985/09/1985-09-01-sunday-september-1.html", preview: "We attended Hartley and Margaret’s 35th anniversary. After, we drove to Woodlawn Cemetery to view Grandma’s grave. We couldn’t find it. The effort fuelled an argument between the boys. Matthew" },
            { day: 15, url: "/entries/1985/09/1985-09-15-sunday-september-15.html", preview: "The fall schedule is up and running. Peter goes to cello twice a week, gym twice a week, for two hours each time, choir and Pioneers on Wednesday. If anything," }
        ],
        "1985-10": [
            { day: 20, url: "/entries/1985/10/1985-10-20-saturday-october-20.html", preview: "Repeated threats of snow, but otherwise the days are sunny and warm. Last year we had drifting snow, cars stranded in the middle of roads, 30 below, high winds. This" },
            { day: 27, url: "/entries/1985/10/1985-10-27-sunday-october-27.html", preview: "The Cherub Choir conductor, Susan Grosse, had a hard time riding herd for the 20 minutes of the service before the performance. Sitting together the kids were noisy and mischievous." }
        ],
        "1985-11": [
            { day: 3, url: "/entries/1985/11/1985-11-03-sunday-november-3.html", preview: "Both boys went Halloween-ing for an hour last Thursday. The weather was scarcely below freezing. They’d yell Halloween Apples at the door. Matthew kicked his bag as he walked. He" }
        ],
        "1985-12": [
            { day: 2, url: "/entries/1985/12/1985-12-02-monday-december-2.html", preview: "Three weeks until the start of Christmas holidays. Peter has reached the middle of a reading competition. He sits second having read 78 books. He’ll settle for nothing but first" },
            { day: 30, url: "/entries/1985/12/1985-12-30-monday-december-30.html", preview: "Holidays are half done. The Christmas tree is turning brown. The umbrella plant will have to be given its place back in the sunlight before it loses even more leaves." }
        ],
        "1986-1": [
            { day: 1, url: "/entries/1986/01/1986-01-01-thursday-january-1.html", preview: "The boy performed lots this season. Since playing at the Centennial, Peter played at school and for both families. Matthew did not play for school, but he did play Twinkle" },
            { day: 9, url: "/entries/1986/01/1986-01-09-thursday-january-9.html", preview: "The temperature gets to plus-2. Grass everywhere. And ice. I’ve been back to school. Cheryl spent the week at home with the flu. Now she’s pregnant, we’re being extra careful." },
            { day: 13, url: "/entries/1986/01/1986-01-13-monday-january-13.html", preview: "Snow is just about gone. Temperature tomorrow is forecast for 8+. Peter attended Erin’s birthday party yesterday. They went water-sliding at the Travelodge. By the time we arrived, he was" },
            { day: 30, url: "/entries/1986/01/1986-01-30-thursday-january-30.html", preview: "Peter has spent the last two evenings constructing a model of the Space Shuttle. We bought it at a hobby store on Broadway for $21.95. He dripped glue onto the" }
        ],
        "1986-2": [
            { day: 19, url: "/entries/1986/02/1986-02-19-wednesday-february-19.html", preview: "The boys have headed off to choir and Pioneers. They’re busy but seem not to notice. Cheryl is in her 4th month. Pale, somewhat disconsolate, hoping to be feeling a" },
            { day: 23, url: "/entries/1986/02/1986-02-23-sunday-february-23.html", preview: "After a spate of cold weather, it has warmed to minus-8. We went tobogganing yesterday at Diefenbaker Park. The boys laughed all the way down, and harder at the bottom." },
            { day: 24, url: "/entries/1986/02/1986-02-24-monday-february-24.html", preview: "We watched Anne of Green Gables with Megan Follows as Anne. Cheryl sat on the sofa. I sat on the floor, leaning against the sofa. Matthew lay across my legs." }
        ],
        "1986-3": [
            { day: 2, url: "/entries/1986/03/1986-03-02-sunday-march-2.html", preview: "Both boys have been sick since Tuesday. Cough, high fever, vomiting. They’re a bit cheerier today, though Peter is still in his pajamas with a flushed face. Matthew fell out" },
            { day: 11, url: "/entries/1986/03/1986-03-11-tuesday-march-11.html", preview: "Matthew was crying this evening. First, Cheryl called Peter Matthew. Then Matthew discovered that his bed was still unmade. The boys like to be drilled on skills, Peter on adding" },
            { day: 14, url: "/entries/1986/03/1986-03-14-friday-march-14.html", preview: "Just as the snow is finishing up, Cheryl’s parents are preparing a short trip to Panorama. My family got together last night to celebrate Mom’s birthday. We sat on the" },
            { day: 16, url: "/entries/1986/03/1986-03-16-sunday-march-16.html", preview: "I’ll ride my bicycle to school tomorrow. Why not? The roads and sidewalks are nearly dry. Cheryl’s parents left for BC. We’re thinking ahead to Easter. We’re thinking of destinations" }
        ],
        "1986-4": [
            { day: 13, url: "/entries/1986/04/1986-04-13-sunday-april-13.html", preview: "The day after Cheryl’s birthday. 32 years. We bought a car last Thursday in a private deal. Matthew asks over and over if this is our car. Reading by everyone" }
        ],
        "1986-5": [
            { day: 4, url: "/entries/1986/05/1986-05-04-sunday-may-4.html", preview: "We get great enjoyment watching the boys together, listening when they’re apart, each going on about the other. If we’ve been critical of something Matthew’s done, Peter comes to his" },
            { day: 10, url: "/entries/1986/05/1986-05-10-saturday-may-10.html", preview: "Friday night I dropped by the library. Cheryl stayed with the boys in the car. Matthew was sleeping. When I returned, Peter was out of his spot, sitting with his" },
            { day: 27, url: "/entries/1986/05/1986-05-27-tuesday-may-27.html", preview: "The temperature has risen as high as 33 degrees the past few days. It’s windy. Peter says everyday how he dislikes he heat. His face is strawberry red, his is" }
        ],
        "1986-6": [
            { day: 22, url: "/entries/1986/06/1986-06-22-sunday-june-22.html", preview: "Peter went on his first date a while ago. Jocelyn Roston asked him to go to the Lakeview confectionary after school. He asked us, then accepted. When it came time" }

        "1986-7": [
            { day: 1, url: "/entries/1986/07/1986-07-01-tuesday-july-1.html", preview: "Last Thursday, Cheryl and I went to Damn Yankees. Friday, school ended. Saturday, I picked up the shed and extra 4X4s for the base from Beaver Lumber. Sunday, Joel and" },
            { day: 1, url: "/entries/1986/07/1986-07-01-wednesday-july-1.html", preview: "I started early on the shed. By the day’s end, thanks to help from Cheryl and the boys, it is nearly done. Peter spent the day with Danielle and Suzanne," },
            { day: 4, url: "/entries/1986/07/1986-07-04-friday-july-4.html", preview: "The shed is done. The yard is trim. Peter and Matthew played hide-and-seek with Danielle and her 5 year old brother, Colin, while I weeded the garden. Matthew and Colin" },
            { day: 10, url: "/entries/1986/07/1986-07-10-thursday-july-10.html", preview: "Peter and I arrived at Waskesieu Wednesday at 1:30 after breakfasting and visiting the library with Cheryl and Matthew. We enjoyed the ride up. Sun, warmth, good conversation. We planned" },
            { day: 22, url: "/entries/1986/07/1986-07-22-wednesday-july-22.html", preview: "Three short-haired males beating the summer heat, just when the temperature becomes more moderate, breezy, cloudy. Peter helped Cheryl make my upcoming birthday cake—German Chocolate—by cutting out large circles in" }
        ],
        "1986-8": [
            { day: 1, url: "/entries/1986/08/1986-08-01-friday-august-1.html", preview: "I put together the bunk beds yesterday with the boy’s help while Cheryl shopped for sheets. After that, Peter sat on the top bunk with Matthew, Kelsey Miller, and Erin" },
            { day: 16, url: "/entries/1986/08/1986-08-16-saturday-august-16.html", preview: "Today is THE day. Cheryl is expecting at any moment. Just not this moment. Just now she is playing the piano, claiming she is feeling better than she has in" },
            { day: 17, url: "/entries/1986/08/1986-08-17-sunday-august-17.html", preview: "Still nothing. This evening I played guitar for the boys. One piece was John Denver’s My Sweet Lady (a man who deeply loves a woman wonders why every time he" },
            { day: 26, url: "/entries/1986/08/1986-08-26-tuesday-august-26.html", preview: "Tonight is probably the last night before the long-overdue baby is born. My certainty is due to the decision for Cheryl to have it either spontaneously (and at this moment" }
        ],
        "1986-9": [
            { day: 1, url: "/entries/1986/09/1986-09-01-monday-september-1.html", preview: "Erik Mitchell Skarsgard Hedlin. He was born Wednesday, August 27, 7:45 am. Cheryl is now home from hospital. Erik wasn’t jaundiced enough to warrant keeping them any longer. Cheryl signed" },
            { day: 4, url: "/entries/1986/09/1986-09-04-thursday-september-4.html", preview: "Papa said he wanted to keep Erik. Peter said, ‘You can’t have him for anything. He’s worthless.’ Yesterday, Matthew held Erik for 90 minutes. He wakes up only twice a" },
            { day: 14, url: "/entries/1986/09/1986-09-14-sunday-september-14.html", preview: "The routine has returned. Saturday morning was spent at the University with both boys. Matthew has officially begun playing cello. He was unhappy that his group didn’t actually play their" },
            { day: 28, url: "/entries/1986/09/1986-09-28-sunday-september-28.html", preview: "Last Sunday (September 21) we drove north in spite of heavy rain and wind to be briefly at the farm for the boys’ sakes, then in Canwood for multiple birthday" }
        ],
        "1986-10": [
            { day: 7, url: "/entries/1986/10/1986-10-07-tuesday-october-7.html", preview: "We attended Open House at Lakeview school last Wednesday (October 1). His teacher explained the curricula and looked a examples of Peter’s work, which she praised. His French teacher said," },
            { day: 17, url: "/entries/1986/10/1986-10-17-friday-october-17.html", preview: "Last Friday (October 10) John and Irma visited in the afternoon. We walked in Lakeview Park. Diane and Ernie came for supper. Their twins, nearly a year old, crawled over" }
        ],
        "1986-11": [
            { day: 10, url: "/entries/1986/11/1986-11-10-monday-november-10.html", preview: "Last Saturday (November 1) the boys slept at my parents’. We went to Leask for Andy’s wedding. Last Wednesday evening (November 5), the boys played at their recital at St." },
            { day: 30, url: "/entries/1986/11/1986-11-30-sunday-november-30.html", preview: "Matthew has a cold. It makes him pretty antagonistic. His ear was itching. I went after it with a Q-tip. That didn’t help much. Peter spent some time reading The" }
        ],
        "1986-12": [
            { day: 7, url: "/entries/1986/12/1986-12-07-sunday-december-7.html", preview: "Peter has been very excited this past week about Suzuki program rehearsals and performance with the Symphony. Even though the practice on stage of the Centennial Auditorium has meant lineups" },
            { day: 23, url: "/entries/1986/12/1986-12-23-tuesday-december-23.html", preview: "Christmas Eve (Wednesday) was at Marg and Roy Ardell’s. The boys played well with Bradley and Michael. Another huge meal, with bowls of chocolate mousse and whipped cream left uneaten." },
            { day: 27, url: "/entries/1986/12/1986-12-27-saturday-december-27.html", preview: "" },
            { day: 28, url: "/entries/1986/12/1986-12-28-sunday-december-28.html", preview: "On Monday December 29, Joel and I went for a game of racquetball, then came home for tomato soup and cheese biscuits. We visited, talked about Navy discipline (Joel is" },
            { day: 30, url: "/entries/1986/12/1986-12-30-tuesday-december-30.html", preview: "" },
            { day: 31, url: "/entries/1986/12/1986-12-31-wednesday-december-31.html", preview: "The new snow has freshened everything. I skied on the new tracks on the Wildwood golf course. In places they were obliterated by several families. Once around was enough. I’ve" }

        "1987-1": [
            { day: 3, url: "/entries/1987/01/1987-01-03-saturday-january-3.html", preview: "Thursday, New Year’s Day was brilliant and mild. As warm as minus-5. It has been this way through the entire holiday. The sun turns snow to slush in the streets." },
            { day: 7, url: "/entries/1987/01/1987-01-07-wednesday-january-7.html", preview: "Cheryl is so much more relaxed now than before Christmas, when she was so busy shopping, baking, getting the kids ready, that she even sleeps in the afternoon with Matthew" },
            { day: 12, url: "/entries/1987/01/1987-01-12-monday-january-12.html", preview: "Record high temperatures in western Canada, contrasting with the record lows in Eastern Canada. Europe is reporting the worst winter in memory. Here it’s running water, sweaters only outside, too" }
        ],
        "1987-2": [
            { day: 15, url: "/entries/1987/02/1987-02-15-sunday-february-15.html", preview: "Nothing especially ‘Valentinsey’ happened yesterday. We (Peter and I) are just done a four-day weekend. I spent Thursday and Friday at Institute and Convocation. Peter was home the entire time" },
            { day: 24, url: "/entries/1987/02/1987-02-24-tuesday-february-24.html", preview: "We spent the weekend at Anglin Lake with 8 other staff members and their families. The drive up was tricky. Heavy winds, icy roads, drifting snow, cars in the ditch" }

        "1987-3": [
            { day: 9, url: "/entries/1987/03/1987-03-09-monday-march-9.html", preview: "Matthew, on how to make bread: ‘First you grease the pan. Then you put on the dough. You poke it down, put a blanket on it. Let it grow for" }
        ],
        "1987-4": [
            { day: 21, url: "/entries/1987/04/1987-04-21-tuesday-april-21.html", preview: "It’s our fifth day of holidays. It is presently 12:45. Erik has slept for 90 minutes. Cheryl and I are in the living room. Peter is outside with David Stearn." },
            { day: 26, url: "/entries/1987/04/1987-04-26-sunday-april-26.html", preview: "Peter and Matthew left for the north yesterday with Cheryl’s parents. Cheryl and I stayed behind, tending to Erik’s fever. We hoped it would be down today so we could" }
        ],
        "1987-5": [
            { day: 9, url: "/entries/1987/05/1987-05-09-sunday-may-9.html", preview: "Mother’s Day was spent entirely away from the house. First church, then Travelodge for dinner, baseball at Cheryl’s parents, supper at my parents’, then coffee at the Ardell’s with all" },
            { day: 17, url: "/entries/1987/05/1987-05-17-sunday-may-17.html", preview: "We spent our days up north, mowing lawns, picking stones, planting the garden. The boys went into the wood to arrange sawn logs for a fort. It has a doorway," },
            { day: 24, url: "/entries/1987/05/1987-05-24-sunday-may-24.html", preview: "The last entry was stopped abruptly when the Coleman lamp quit. Peter has mastered the motorcycle in 1st gear, and goes round and round the house. Monday was frigid cold." },
            { day: 25, url: "/entries/1987/05/1987-05-25-monday-may-25.html", preview: "Supper at Delphi’s. Cheryl got her Income Tax return. Ravioli again for Peter and Matthew, their favourite. Peter’s one gripe is the cheese. The Leopards played a home game against" },
            { day: 31, url: "/entries/1987/05/1987-05-31-sunday-may-31.html", preview: "Peter has cleats. We got them just in time for his Wednesday game. It got rained out. Peter came out of his room with the cleats around his neck. I" }
        ],
        "1987-6": [
            { day: 8, url: "/entries/1987/06/1987-06-08-monday-june-8.html", preview: "We had Grade 12 Graduation on Friday at the Centennial Auditorium. Staff met between the ceremony and banquet at Willoughby’s in the Holiday Inn. Saturday was the cello concert and" },
            { day: 10, url: "/entries/1987/06/1987-06-10-wednesday-june-10.html", preview: "Cheryl spends her day pretty much following Erik, mostly stopping him from putting paper and dirt in his mouth. It’s the same thing when I get home. He goes to" },
            { day: 15, url: "/entries/1987/06/1987-06-15-monday-june-15.html", preview: "It is near +40 and windy. The house is hot. All the windows are open. We have a fan in every room. Erik woke up last night soaking with sweat" }
        ],
        "1987-7": [
            { day: 7, url: "/entries/1987/07/1987-07-07-tuesday-july-7.html", preview: "Peter is 9 years old. Cheryl and I are finished painting the house, which is not easy in the company of three kids. We didn’t paint two bedrooms. We stayed" },
            { day: 12, url: "/entries/1987/07/1987-07-12-sunday-july-12.html", preview: "Thursday was spent at the Exhibition. It has been rainy. We were lucky to pick the one day that was all sun. We went at 2, found a parking spot," },
            { day: 19, url: "/entries/1987/07/1987-07-19-sunday-july-19.html", preview: "The French family reunion ended today. Yesterday at 8:30, after several mornings of Matthew asking if it was tomorrow that we were going, we left for Regina. The rain started" }
        ],
        "1987-8": [
            { day: 12, url: "/entries/1987/08/1987-08-12-wednesday-august-12.html", preview: "We’ve returned from a few days at Christopher Lake. We went up August 2, Sunday afternoon. Adolph Peters lent us his partially completed cabin. The finished part gives more than" },
            { day: 19, url: "/entries/1987/08/1987-08-19-wednesday-august-19.html", preview: "Erik walks everywhere, until he falls. Then he crawls to the nearest chair or to the wall, hoists himself back up, and walks again. He walks as if the floor" },
            { day: 23, url: "/entries/1987/08/1987-08-23-sunday-august-23.html", preview: "Just back from Meadow Lake. We drove up Friday, and spent two nights with Peter and Louise. They live on a quarter section of bush and wheat eight miles south" }
        ],
        "1987-9": [
            { day: 13, url: "/entries/1987/09/1987-09-13-sunday-september-13.html", preview: "We have celebrated Erik’s first birthday. The Grambos joined us from Brooks Alberta. Erik got a Coleco Music Van with a button to activate a merry-go-round. He got a camera" },
            { day: 27, url: "/entries/1987/09/1987-09-27-sunday-september-27.html", preview: "Fall continue to be glorious. The trees are at their best. Every day the temperature rises to 20° with light breezes. We walked as a family along the Meewasin trail." }
