<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timeline - Hedlin Family Journal</title>
    <link rel="stylesheet" href="/static/css/styles.css">
    
<style>
    .timeline-container {
        position: relative;
        width: 100%;
        height: 400px;
        margin: 2rem 0;
        border: 1px solid #ddd;
        background: #fafafa;
    }
    .timeline-canvas {
        width: 100%;
        height: 100%;
    }
    .timeline-tooltip {
        position: absolute;
        background: white;
        border: 1px solid #333;
        padding: 0.5rem;
        border-radius: 4px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        pointer-events: none;
        max-width: 250px;
        display: none;
    }
    .timeline-tooltip.visible {
        display: block;
    }
</style>

</head>
<body>
    <div class="journal-container">
        <header class="journal-header">
            <div class="header-content">
                <h1 class="journal-title">A Hedlin Family Journal</h1>
                
                <p class="journal-subtitle">
                    This journal is for our boys (Peter 1978, Matthew 1982, Erik 1986).
                </p>
                
            </div>
        </header>

        <nav class="journal-nav">
            <a href="/index.html">Home</a>
            <a href="/timeline.html">Timeline</a>
            <a href="/archive.html">Archive</a>
        </nav>

        <main class="journal-main">
            
<div class="timeline-page">
    <h1>Interactive Timeline</h1>
    <p class="timeline-intro">
        Hover over the timeline to see entry previews. Click to view the full entry.
    </p>

    <div class="timeline-controls">
        <button id="zoom-out" class="timeline-btn">− Zoom Out</button>
        <button id="zoom-in" class="timeline-btn">+ Zoom In</button>
        <select id="year-filter" class="timeline-select">
            <option value="">All Years</option>
            
            <option value="1983">1983</option>
            
        </select>
    </div>

    <div class="timeline-container">
        <canvas id="timeline-canvas" class="timeline-canvas"></canvas>
        <div id="timeline-tooltip" class="timeline-tooltip"></div>
    </div>

    <div class="timeline-legend">
        <span class="legend-item">
            <span class="legend-dot"></span> Journal Entry
        </span>
        <span class="legend-item">
            <span class="legend-dot legend-dot-image"></span> Entry with Images
        </span>
    </div>
</div>

        </main>

        <footer class="journal-footer">
            <p>Hedlin Family Journal &copy; 2026</p>
        </footer>
    </div>

    
<script src="/static/js/timeline.js"></script>

</body>
</html>
