# Hedlin Family Journal Configuration

[source]
# Source mode: "docx" for local DOCX files, "gdocs" for Google Docs
mode = "gdocs"

[gdocs]
# Google Docs configuration (only used when source.mode = "gdocs")
# folder_id: The Google Drive folder ID containing journal documents
#           Find this by opening the folder in Drive and copying from the URL
# credentials: Path to service account credentials JSON file
folder_id = "1az3bUaEal-dHi_vBmzWY8upCl90s4NQu"
credentials = "credentials.json"

[theme]
# Color palette - greyscale only
background = "#f5f5f5"
text = "#131313"
muted = "#999999"
border = "#e0e0e0"
hover = "#000000"

[preview]
# Number of words to show in entry preview
word_count = 30

[site]
title = "A Hedlin Family Journal"
subtitle = ""
