    entries: {
        "1983-7": [
            { day: 23, url: "/entries/1983/07/1983-07-23-saturday-july-23-1983.html", preview: "In order to make future recordings more meaningful, today’s entry will lay out some of the more important events since our marriage on August 16, 1975. Peter David Skarsgard was" },
            { day: 24, url: "/entries/1983/07/1983-07-24-sunday-july-24.html", preview: "Matthew slept from 8:30 to 6 am. The family was actively awake by 8 am. We made relaxed preparations for church: breakfast, bathing, dressing. Peter cares almost completely for himself." },
            { day: 25, url: "/entries/1983/07/1983-07-25-monday-july-25.html", preview: "Sunny and warm. The basement got another start – rough wiring completed and first sheets of gyproc are set onto north wall. Peter enjoys the project far more than I" },
            { day: 26, url: "/entries/1983/07/1983-07-26-tuesday-july-26.html", preview: "Matthew seems to have rescheduled his nights. Now they run from 8:30 pm – 6:30 am. He was up several times last night after 4. One final effort was made" },
            { day: 27, url: "/entries/1983/07/1983-07-27-wednesday-july-27.html", preview: "Cheryl will pick Peter up on the way to his swimming lessons. With Matthew alone, the schedule more than relaxes. He woke at 7, we ate breakfast by 7:40. Cheryl" },
            { day: 28, url: "/entries/1983/07/1983-07-28-thursday-july-28.html", preview: "The morning was spent shopping for goggles for Cheryl and Peter. It’s not easy to find the model that Cheryl says she thinks she’s sure she saw someone wearing. Peter" },
            { day: 29, url: "/entries/1983/07/1983-07-29-friday-july-29.html", preview: "The day was spent getting ready for Calgary. Matthew had us up as early as usual. I trimmed, watered and weeded the lawn and beds by 9:00. Cheryl has organized" },
            { day: 31, url: "/entries/1983/07/1983-07-31-sunday-july-31.html", preview: "We were out of bed by 7:00. After some talk we walked on Mount Royal, just up from Michael’s. The road was steep and by the time we got to" }
        ],
        "1983-8": [
            { day: 1, url: "/entries/1983/08/1983-08-01-monday-august-1.html", preview: "Peter registers for the Suzuki Institute. Up at 7:10, with an arrival time of 8, Peter is not happy. He doesn’t want a day with the cello. When registering at" },
            { day: 2, url: "/entries/1983/08/1983-08-02-tuesday-august-2.html", preview: "Today went smoothly. Everyone has adjusted to the new schedule. Matthew woke at 6:45 and slept with me in the living room the next half-hour. Peter spent one hour in" },
            { day: 3, url: "/entries/1983/08/1983-08-03-wednesday-august-3.html", preview: "Peter is finding more to enjoy. He listens, follows the instructions, relaxes when given the chance, has the confidence to participate in his own right. Once Matthew does wake, he" },
            { day: 8, url: "/entries/1983/08/1983-08-08-monday-august-8.html", preview: "The house was a bit of a merry-go-round this morning. Matthew slept well and woke at 7. I got up with him. He played with toys in the living room" },
            { day: 9, url: "/entries/1983/08/1983-08-09-tuesday-august-9.html", preview: "Matthew was awake by 7:15. Cheryl and I sat together with him and talked about family, parents and childraising. Peter woke at 8:30. We ate breakfast. Peter practised cello from" },
            { day: 10, url: "/entries/1983/08/1983-08-10-wednesday-august-10.html", preview: "Now that Matthew is up early each day Cheryl and I get a quick start. All the preliminaries, washing, eating, cleaning up, are finished by 9. Peter had a good" },
            { day: 11, url: "/entries/1983/08/1983-08-11-thursday-august-11.html", preview: "Peter began his day with cello practise. Cheryl took the boys to “Humpty Dumpty” for Kindergarten clothes. Peter got four shirts. I finished cleaning the basement and tended the yard." },
            { day: 12, url: "/entries/1983/08/1983-08-12-friday-august-12.html", preview: "A day passed but little happened. The morning was busy but nondescript. In the afternoon Cheryl and I dropped Peter off at the Field House for his final ‘Pedal Pusher’" },
            { day: 13, url: "/entries/1983/08/1983-08-13-saturday-august-13.html", preview: "Matthew was up by 7, Peter by 7:30. Peter watched cartoons with Erin for a half hour and then lay on the floor until 11:45. Matthew nudged him occasionally to" },
            { day: 14, url: "/entries/1983/08/1983-08-14-sunday-august-14.html", preview: "We went to church today. We rushed and left the house by 9:20. The church was crowded. The service was handled by a new intern David Lefsrud and a onetime" },
            { day: 15, url: "/entries/1983/08/1983-08-15-monday-august-15.html", preview: "Matthew was up by 7. I sat with him and read Lawrence’s St. Mawr, and Matthew played with a Fisher-Price cash register. He turned the crank to open the drawer," },
            { day: 16, url: "/entries/1983/08/1983-08-16-tuesday-august-16.html", preview: "Today is our 8th Anniversary. Money is tight so we will wait for another year to celebrate. We do plan to get a subscription to Omni magazine as a small" },
            { day: 17, url: "/entries/1983/08/1983-08-17-wednesday-august-17.html", preview: "This day was spent preparing for Waskesiu. Cheryl did much running around with the boys: Peter to swimming and home again for an early lunch. The afternoon was much the" },
            { day: 18, url: "/entries/1983/08/1983-08-18-tuesday-august-18.html", preview: "Matthew was up at 6. I didn’t think that he was quite ready so I held him by the crib. His head rested on my shoulder and his arms were" },
            { day: 19, url: "/entries/1983/08/1983-08-19-friday-august-19.html", preview: "Today was full. Matthew was up early even though Cheryl had stuffed him with fruit and kept him up till late. We breakfasted on Variety-Pak cereal and eggs. After we" },
            { day: 20, url: "/entries/1983/08/1983-08-20-saturday-august-20.html", preview: "After breakfast we went for a walk into town. It was 8:45. The weather was much warmer than yesterday. Peter used 25 cents of his allowance to buy fire hydrant" },
            { day: 21, url: "/entries/1983/08/1983-08-21-sunday-august-21.html", preview: "This is the last day at Waskesiu. Cheryl, Peter and I are spending our time feeling badly about it. After an early rise and shower (Peter insisted on having his" },
            { day: 22, url: "/entries/1983/08/1983-08-22-monday-august-22.html", preview: "Adolph was at the door at 7:15. He had driven in from the lake. None of us were up when he arrived, but breakfast was on the table by 7:50." },
            { day: 23, url: "/entries/1983/08/1983-08-23-tuesday-august-23.html", preview: "Today we finished at the farm and went home. After breakfast, Cheryl’s dad and I stacked lumber in the loft, cleaned around the sheds, picked up tools, closed up the" },
            { day: 24, url: "/entries/1983/08/1983-08-24-wednesday-august-24.html", preview: "Cheryl had planned running around with the boys this morning. She took them to Premiere Optical and Sears to find frames for Peter’s glasses. She bought white running shoes with" },
            { day: 25, url: "/entries/1983/08/1983-08-25-thursday-august-25.html", preview: "This has been a day of work for Cheryl and me. The boys have played alone. Cheryl sewed clothing for school. I spent time on the writing project. Peter was" },
            { day: 26, url: "/entries/1983/08/1983-08-26-friday-august-26.html", preview: "The work (aided regrettably by the child pen) carried on for part of the day. I wrote out a problem involving information and planned to meet with PDR on Wednesday." },
            { day: 27, url: "/entries/1983/08/1983-08-27-saturday-august-27.html", preview: "When we woke up we talked about the Genesa Seminar and decided to make what we could of it. Cheryl managed to get a babysitter for Sunday, 10 - 2," },
            { day: 28, url: "/entries/1983/08/1983-08-28-sunday-august-28.html", preview: "Peter was happy to stay home today. Sandra came at 10. He was walking Matthew as we left. The car started. We were at Korpan’s by 10:35. Everybody was on" },
            { day: 29, url: "/entries/1983/08/1983-08-29-monday-august-29.html", preview: "The day was busy. Everybody is involved in separate projects. Cheryl spent a good half hour with Peter on the cello. Matthew is more mobile every day, ceaseless energy. We" },
            { day: 30, url: "/entries/1983/08/1983-08-30-tuesday-august-30.html", preview: "Matthew had the best sleep of his life, from 9 pm to 8 am, with a quick diaper change at 6:30. But then he had one of the unhappiest days" },
            { day: 31, url: "/entries/1983/08/1983-08-31-wednesday-august-31.html", preview: "This is the final day of our holiday. Cheryl and I have thought about it more than anything else. We have had a very good summer - to anyone else" }
        ],
        "1983-9": [
            { day: 1, url: "/entries/1983/09/1983-09-01-thursday-september-1.html", preview: "We had a good day. It began with a mixup; Crystal was delayed at a dentist and did not arrive until 9. We attended meetings at our schools in the" },
            { day: 2, url: "/entries/1983/09/1983-09-02-friday-september-2.html", preview: "Our day started more smoothly. Crystal was ready at 8:15. We were at our schools in plenty of time. Even though the boys are very happy to be with Crystal," },
            { day: 3, url: "/entries/1983/09/1983-09-03-saturday-september-3.html", preview: "We were up at 6. We rushed about while the boys slept, then I went into Peter’s room and I had hardly touched him before he said straight up and" },
            { day: 4, url: "/entries/1983/09/1983-09-04-sunday-september-4.html", preview: "We were up early again. Matthew is teething. We prepared to be at the 9:30 service. Until then we enjoyed ourselves. Cheryl and I even sat down with a cup" },
            { day: 5, url: "/entries/1983/09/1983-09-05-monday-september-5.html", preview: "We have the Labour Day holiday today. We haven’t planned much outside of having Augusta over. Peter started by practising cello. It is really coming. He seemed excited about it." },
            { day: 6, url: "/entries/1983/09/1983-09-06-tuesday-september-6.html", preview: "Matthew was up at 6:30. Then Peter was too. School. We washed and dressed. Everyone ate breakfast by 7:30. Augusta was here at 7:55. How comfortable this is. I walked" },
            { day: 7, url: "/entries/1983/09/1983-09-07-wednesday-september-7.html", preview: "We were up with the 7 o’clock news. Peter was home for the day. Augusta was on time. We left for school shortly after. Cheryl still doesn’t know what she" },
            { day: 8, url: "/entries/1983/09/1983-09-08-thursday-september-8.html", preview: "Up at 6:20. These long days are killers. Cheryl and I are restless at night. We sat with the boys awhile before the time came to go. We left shortly" },
            { day: 9, url: "/entries/1983/09/1983-09-09-friday-september-9.html", preview: "Troubles. Augusta was here at 7:55. She sits in the living room and laughs at Matthew while Cheryl and I prepare to leave. She had rain on her coat and" },
            { day: 10, url: "/entries/1983/09/1983-09-10-saturday-september-10.html", preview: "Matthew and Peter wake at 6:20. Since neither had bothered us during the night this was not too much of a crime. We spent the early hours doing what has" },
            { day: 11, url: "/entries/1983/09/1983-09-11-sunday-september-11.html", preview: "We prepared for church. Peter was to register for Sunday School at 9:45. We get more information about the Korean Jetliner. The Soviets interviewed the pilots who shot down the" },
            { day: 12, url: "/entries/1983/09/1983-09-12-monday-september-12.html", preview: "Rain again. With temperatures dropping close to 0 degrees we’ll be waking up in snow pretty soon. When Augusta arrived, Cheryl and I left. The Mazda wouldn’t start. I was" },
            { day: 13, url: "/entries/1983/09/1983-09-13-tuesday-september-13.html", preview: "We’ve made the decision to eat porridge in the morning. We burned the first pot and had the second cooked just in time to eat it before Augusta came. Peter" },
            { day: 14, url: "/entries/1983/09/1983-09-14-wednesday-september-14.html", preview: "The morning went smoothly, except that Peter felt so sick that we kept him home. Augusta was ready for the kids at 8. I started the Mazda and took it" },
            { day: 15, url: "/entries/1983/09/1983-09-15-thursday-september-15.html", preview: "We had a tough start today, porridge and school. Peter had a stomachache and thought that perhaps he shouldn’t eat or go to school. Tears, tears, tears. I think Augusta" },
            { day: 16, url: "/entries/1983/09/1983-09-16-friday-september-16.html", preview: "Dr Hamilton phoned at 6:30 this morning to clear aside some time to see Matthew. We took him in at 7:45. Peter and I sat in the waiting room while" },
            { day: 17, url: "/entries/1983/09/1983-09-17-saturday-september-17.html", preview: "Peter says this is his first real holiday. We spent the day relaxing, one of the most enjoyable Saturdays in a long time. Matthew was up at 6. Cheryl proposed" },
            { day: 18, url: "/entries/1983/09/1983-09-18-sunday-september-18.html", preview: "We mixed leisure and work today. After waking at 7 and playing awhile in bed with the boys we ate breakfast, dressed and took Peter to Sunday School. Matthew was" },
            { day: 19, url: "/entries/1983/09/1983-09-19-monday-september-19.html", preview: "Another hurricane blew through the house this morning. Peter had to eat porridge again. He couldn’t quite believe we were putting such pressure on him to finish. He was still" },
            { day: 21, url: "/entries/1983/09/1983-09-21-wednesday-september-21.html", preview: "Matthew was up at 5. First Cheryl and then I tried to get him back to sleep. He was quiet while we patted him and hummed, but we could get" },
            { day: 22, url: "/entries/1983/09/1983-09-22-thursday-september-22.html", preview: "The days have become quite routine, getting up, escaping Matthew, working, returning to the same hurry and unrest at home. One longs for do-nothing weekends. Cheryl and I prepared ourselves" },
            { day: 23, url: "/entries/1983/09/1983-09-23-friday-september-23.html", preview: "And Friday it is. Let’s say that a few disrupted nights put together with lively classrooms makes one very tired. After our porridge battle with Peter, Cheryl and I went" },
            { day: 24, url: "/entries/1983/09/1983-09-24-saturday-september-24.html", preview: "How good our weekends have become. We made a great effort to relax, do nothing unpleasant, be outside, play with the boys, get our hands on every conceivable form of" },
            { day: 25, url: "/entries/1983/09/1983-09-25-sunday-september-25.html", preview: "Cheryl’s parents arrived home from their trip tonight, or so Peter told us when he woke up at 7. He gave us the idea he didn’t get much sleep last" },
            { day: 26, url: "/entries/1983/09/1983-09-26-monday-september-26.html", preview: "Max Abraham gave me a ride home after school. Cheryl was outside in the sun. Peter was on the sidewalk in shorts playing with his twisting car. Cheryl planned to" },
            { day: 27, url: "/entries/1983/09/1983-09-27-tuesday-september-27.html", preview: "Peter’s breakfast consisted of a bit of everything. He was still in his pj’s when Augusta came. Matthew followed close behind us and cried when we left. Peter’s girlfriends, Kirsten" },
            { day: 28, url: "/entries/1983/09/1983-09-28-wednesday-september-28.html", preview: "Peter received his first pair of gloves, grey knit with rather intricate red and white diamond patterns on the back and palm. He wears them inside the house, keeping his" },
            { day: 29, url: "/entries/1983/09/1983-09-29-thursday-september-29.html", preview: "Payday at last. We went to the Delphi restaurant for supper. Matthew sat beside Cheryl in his blue rack-seat. He banged a knife on the table. Peter was sliding under" },
            { day: 30, url: "/entries/1983/09/1983-09-30-friday-september-30.html", preview: "Cheryl and I went to a car rally put on by her staff. We began at six-thirty with seven teams of four. Cheryl went with team 7, I went with" }

        "1983-10": [
            { day: 1, url: "/entries/1983/10/1983-10-01-saturday-october-1.html", preview: "Cheryl's parents phoned as we were eating breakfast to see if we’d like to meet them for coffee at the Sheraton Cavalier. Peter went by himself to the Men’s bathroom" },
            { day: 2, url: "/entries/1983/10/1983-10-02-sunday-october-2.html", preview: "I spent the morning at school and Cheryl sewed. Once home I found Peter on the floor wrestling with Cheryl. They were trying to practise cello but Peter insisted on" },
            { day: 4, url: "/entries/1983/10/1983-10-04-tuesday-october-4.html", preview: "Matthew had his picture taken at Fong’s on 8th Street. Cheryl had him in an outfit we bought on Saturday. Each time the light popped he said, ‘Uh oh.’ Cheryl" },
            { day: 5, url: "/entries/1983/10/1983-10-05-wednesday-october-5.html", preview: "Peter didn’t have much to say about school. He had more to say about spending the afternoon with Kirsten Jensen. Matthew slept only half an hour. I had a guitar" },
            { day: 6, url: "/entries/1983/10/1983-10-06-thursday-october-6.html", preview: "I picked Michael up at the airport. He flew in from Calgary at 8:30. He’s happy about things, his apartment, which is two blocks from Uncle Ralph’s and three from" },
            { day: 7, url: "/entries/1983/10/1983-10-07-friday-october-7.html", preview: "Peter woke up with a fever and aches. We kept him home from school. Matthew isn’t feeling very well either, but that hasn’t affected his humour. He went around with" },
            { day: 8, url: "/entries/1983/10/1983-10-08-saturday-october-8.html", preview: "We met Cheryl’s parents and Lloyd at F:11 early this morning. We drank coffee while we waited to be photographed. Matthew walked around. Peter went with him to get away" },
            { day: 9, url: "/entries/1983/10/1983-10-09-sunday-october-9.html", preview: "Both boys lay in until 7:40. We could hear them humming. We did some cleaning around the house before getting dressed for church. Matthew followed me into the bedroom. The" },
            { day: 10, url: "/entries/1983/10/1983-10-10-monday-october-10.html", preview: "We took Lloyd to the airport at 1:30. Michael and Cathy were there, waiting for Cathy to take the same plane home. Matthew walks with a bobbing action. He is" },
            { day: 13, url: "/entries/1983/10/1983-10-13-tuesday-october-13.html", preview: "Cheryl took the boys to Fong’s Photography to pick up Matthew’s proofs. There are several we like, but we can choose only one. I was home at 4:15. We sat" },
            { day: 14, url: "/entries/1983/10/1983-10-14-wednesday-october-14.html", preview: "Porridge is still a problem for Peter. He smells it and is suddenly full. Our leaving for school is still a problem for Matthew. When he hears Augusta at the" },
            { day: 15, url: "/entries/1983/10/1983-10-15-saturday-october-15.html", preview: "The weather is cold and grey. Winter will be here any day. I dug carrots, enjoying the aroma of the soil. Peter called out to say that Mama had phoned" },
            { day: 15, url: "/entries/1983/10/1983-10-15-thursday-october-15.html", preview: "Peter was riding his bike when I came home, and Cheryl was in the kitchen feeding Matthew. He called to me, and I sat with them at the table. I" },
            { day: 16, url: "/entries/1983/10/1983-10-16-sunday-october-16.html", preview: "I stayed home from church to work on a writing project. Cheryl was back by 11:45. We ate lunch at Ricki’s with Cheryl’s parents. Peter and I went to the" },
            { day: 17, url: "/entries/1983/10/1983-10-17-monday-october-17.html", preview: "Cheryl came by the school at noon to pick me up. A water main break meant everyone was being sent home. Matthew was asleep in the car, and Peter was" },
            { day: 18, url: "/entries/1983/10/1983-10-18-tuesday-october-18.html", preview: "Peter declared that he likes eggs. He says he’s hungry only if he is offered something he wants. Otherwise he is full. In a fit of open-mindedness he promised he’ll" },
            { day: 19, url: "/entries/1983/10/1983-10-19-wednesday-october-19.html", preview: "A very busy day. I went to a guitar lesson. Peter practised cello while Matthew watched, standing, in his crib. Cheryl read George's Marvellous Medicine to Peter. We ate early." },
            { day: 20, url: "/entries/1983/10/1983-10-20-thursday-october-20.html", preview: "I had a staff-student football game at noon. Max drove me home. I found Cheryl and the boys playing in the living room. Prior to that, Peter was riding his" },
            { day: 21, url: "/entries/1983/10/1983-10-21-friday-october-21.html", preview: "The days are sunny and warm, which adds tension to the wait for the start of winter. I walked home from school. Cheryl had picked up tickets for the cellist," },
            { day: 22, url: "/entries/1983/10/1983-10-22-saturday-october-22.html", preview: "We were awake by 7 and were at the Sheraton by 7:30. Cheryl’s parents and grandparents were there already eating. We then went to Market Mall to buy flowers for" },
            { day: 23, url: "/entries/1983/10/1983-10-23-sunday-october-23.html", preview: "The day began warm but cooled off with rain and an icy wind. Winter will be here soon. Every year we are mentally less prepared for it. We took Peter" },
            { day: 24, url: "/entries/1983/10/1983-10-24-monday-october-24.html", preview: "Matthew is happier with Augusta. He watches us go out the door, then appears at the window with Peter to wave goodbye. Cheryl took the boys and her grandparents to" },
            { day: 25, url: "/entries/1983/10/1983-10-25-tuesday-october-25.html", preview: "He has received the cello that replaces the modified viola he has played on for a year. Peter was practising when I got home. The instrument has real strings and" },
            { day: 26, url: "/entries/1983/10/1983-10-26-wednesday-october-26.html", preview: "This is the warmest day since mid-September, but we wonder how long it will hold out. We had bagels and raspberry cream cheese and fruit for breakfast. Peter and Cheryl" },
            { day: 27, url: "/entries/1983/10/1983-10-27-thursday-october-27.html", preview: "Cheryl is nearly finished Peter's costume, a steel-blue spaceman outfit with lightning bolts on the chest and a helmet. Peter can’t wait to wear it. Cheryl thinks it will last" },
            { day: 28, url: "/entries/1983/10/1983-10-28-friday-october-28.html", preview: "Cheryl's father got out of the hospital today, a bit early in his estimation. Peter spent part of the afternoon with him, bringing him pillows and blankets, coming up with" },
            { day: 29, url: "/entries/1983/10/1983-10-29-saturday-october-29.html", preview: "This morning Peter reported being so cold he was covered with ‘sugarbumps’. Group lessons celebrated Halloween. He wore his spaceman outfit there and to gym. Matthew is always humorous, laughing" },
            { day: 30, url: "/entries/1983/10/1983-10-30-sunday-october-30.html", preview: "Cheryl took the boys and her mother to church. I stayed home to work on the Futures project. It’s nearly done. We can use the money. We went to Cheryl’s" },
            { day: 31, url: "/entries/1983/10/1983-10-31-monday-october-31.html", preview: "Who can forget what day it is when Peter shows up dressed for school in a spaceman’s outfit. He took enough oranges with him to feed his whole class and" }
